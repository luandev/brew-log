title: The Lone Tree Orchard
description: Small batches. Seasonal ingredients. Thoughtful experiments.
tagline: Record the process. Refine the craft.
url: "https://luandev.github.io"
baseurl: "/brew-log"
theme: minima
markdown: kramdown

plugins:
  - jekyll-feed
  - jekyll-seo-tag

include:
  - brews

exclude:
  - AGENTS.md
  - ARCHITECTURE.md
  - CONTRIBUTING.md
  - DATA_MODEL.md
  - PRD.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - templates
  - scripts
  - vendor

sass:
  style: compressed

header_pages:
  - index.md
  - pages/batches.md
  - pages/schedule.md
  - docs/brewing-notes.md

defaults:
  - scope:
      path: "brews"
      type: "pages"
    values:
      layout: batch
  - scope:
      path: "brews/**/recipe.md"
    values:
      published: false
  - scope:
      path: "brews/**/log.md"
    values:
      published: false
  - scope:
      path: "brews/**/schedule.md"
    values:
      published: false
  - scope:
      path: "brews/**/tasting.md"
    values:
      published: false
  - scope:
      path: "brews/**/media.md"
    values:
      published: false
