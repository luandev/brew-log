<div class="lto-panel mini-calendar" data-mini-calendar data-baseurl="{{ site.baseurl }}">
  <h2 class="lto-section-title">
    <span class="lto-section-title-text">
      {% include icon.html section_id="calendar" class="lto-section-icon" decorative=true %}
      Calendar
    </span>
  </h2>
  <p class="mini-calendar-header" data-mini-cal-title>{{ site.time | date: "%B %Y" }}</p>
  <div class="mini-calendar-grid" data-mini-cal-grid aria-live="polite"></div>
  <ul class="mini-calendar-legend" data-mini-cal-legend hidden></ul>
  <script type="application/json" class="mini-calendar-data">
    {
      "batches": {{ site.data.calendar.batches | jsonify }},
      "tasks": {{ site.data.calendar.tasks | jsonify }}
    }
  </script>
</div>
<script src="{{ '/assets/js/mini-calendar.js' | relative_url }}" defer></script>
