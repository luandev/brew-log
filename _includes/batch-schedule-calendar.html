{% assign batch_entry = site.data.batches | where: "batch_id", page.batch_id | first %}
{% if batch_entry %}
<section class="batch-schedule-section" id="schedule">
  <h2>Schedule</h2>

  {% include batch-stages-summary.html batch=batch_entry %}

  <div
    class="schedule-calendar schedule-calendar--batch lto-panel"
    data-schedule-calendar
    data-baseurl="{{ site.baseurl }}"
    data-compact="true"
  >
    <div class="schedule-calendar-toolbar">
      <button type="button" class="schedule-nav-btn" data-dir="-1" aria-label="Previous month">‹</button>
      <h3 class="schedule-calendar-title"></h3>
      <button type="button" class="schedule-nav-btn" data-dir="1" aria-label="Next month">›</button>
      <button type="button" class="schedule-nav-btn schedule-nav-today" data-today>Today</button>
    </div>

    <div class="schedule-legend" aria-label="Stage legend"></div>

    <div class="schedule-dow-header" aria-hidden="true">
      <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
    </div>

    <div class="schedule-calendar-body"></div>

    <script type="application/json" class="schedule-calendar-data">
    {
      "today": {{ site.data.calendar.today | jsonify }},
      "batches": [
        {
          "batch_id": {{ batch_entry.batch_id | jsonify }},
          "name": {{ batch_entry.name | jsonify }},
          "type": {{ batch_entry.type | jsonify }},
          "status": {{ batch_entry.status | jsonify }},
          "current_stage_label": {{ batch_entry.current_stage_label | jsonify }},
          "url": {{ batch_entry.url | jsonify }}
        }
      ],
      "stages": {{ site.data.calendar.stages | where: "batch_id", batch_entry.batch_id | jsonify }},
      "tasks": [
        {% for row in batch_entry.schedule %}
        {
          "date": {{ row.date | jsonify }},
          "action": {{ row.action | jsonify }},
          "status": {{ row.status | jsonify }}
        }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      ]
    }
    </script>
  </div>

  <script src="{{ '/assets/js/schedule-calendar.js' | relative_url }}" defer></script>
</section>
{% else %}
<section class="batch-schedule-section" id="schedule">
  <h2>Schedule</h2>
  <p class="lto-empty-state">Run <code>ruby scripts/generate_site_data.rb</code> to load schedule data.</p>
</section>
{% endif %}
