<div class="lto-panel">
  <h2 class="lto-section-title">
    Active Brews
    <a class="lto-btn" href="{{ '/pages/active/' | relative_url }}">View all</a>
  </h2>
  {% assign active = site.data.batches | where_exp: "b", "b.is_active" %}
  {% if active.size > 0 %}
    {% for batch in active %}
      {% include active-brew-card.html batch=batch %}
    {% endfor %}
  {% else %}
    <p style="color:var(--text-muted);">No active batches. Start a new brew to see it here.</p>
  {% endif %}
</div>
