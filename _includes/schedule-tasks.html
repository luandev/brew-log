<div class="lto-panel">
  <h2 class="lto-section-title">Next Tasks</h2>
  {% if site.data.schedule.size > 0 %}
    <ul class="schedule-task-list">
      {% for task in site.data.schedule limit:6 %}
      <li class="schedule-task-item">
        <span class="schedule-task-date">{{ task.date | date: "%b %d" }}</span>
        <span class="schedule-task-icon" aria-hidden="true"></span>
        <div>
          <p class="schedule-task-action">{{ task.action }}</p>
          <p class="schedule-task-batch"><a href="{{ task.url | relative_url }}">{{ task.name }}</a></p>
        </div>
      </li>
      {% endfor %}
    </ul>
    <a class="lto-link-footer" href="{{ '/pages/schedule/' | relative_url }}">View full schedule ›</a>
  {% else %}
    <p style="color:var(--text-muted);font-size:0.9rem;">No pending tasks.</p>
  {% endif %}
</div>
